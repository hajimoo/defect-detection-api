services:
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ai-defect-detection-db/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ../defect-detection-frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mysql_data:
  upload_data:
